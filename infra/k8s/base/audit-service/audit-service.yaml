apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: taskpilot
  labels:
    app: audit-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-service
  template:
    metadata:
      labels:
        app: audit-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "audit-service"
        dapr.io/app-port: "8000"
        dapr.io/log-level: "info"
    spec:
      containers:
      - name: audit-service
        image: audit-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: taskpilot
spec:
  selector:
    app: audit-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: ClusterIP
