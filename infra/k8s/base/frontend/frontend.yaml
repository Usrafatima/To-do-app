apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: taskpilot
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "frontend"
        dapr.io/app-port: "3000"
        dapr.io/log-level: "info"
    spec:
      containers:
      - name: frontend
        image: frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: DAPR_HTTP_PORT
          value: "3500"
        # We don't need NEXT_PUBLIC_API_URL here because client-side calls go to /api/proxy (relative)
        # which hits the Next.js server, which uses Dapr sidecar.
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: taskpilot
spec:
  selector:
    app: frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
  type: ClusterIP
