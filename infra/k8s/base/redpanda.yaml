apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: taskpilot
  labels:
    app: redpanda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
      - name: redpanda
        image: docker.redpanda.com/redpandadata/redpanda:latest
        args:
          - redpanda
          - start
          - --overprovisioned
          - --smp 1 
          - --memory 1G
          - --reserve-memory 0M
          - --node-id 0
          - --check=false
          - --kafka-addr PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:9094
          - --advertise-kafka-addr PLAINTEXT://redpanda:9092,OUTSIDE://localhost:9094
          - --pandaproxy-addr 0.0.0.0:8082
          - --advertise-pandaproxy-addr localhost:8082
        ports:
        - containerPort: 9092
          name: internal
        - containerPort: 9094
          name: external
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: taskpilot
spec:
  type: ClusterIP
  selector:
    app: redpanda
  ports:
  - name: internal
    port: 9092
    targetPort: 9092
