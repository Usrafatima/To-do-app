name: Build and Deploy

on:
  push:
    branches:
      - main
      - phase-5*

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Task Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/task-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/task-service:latest

      - name: Build and push Audit Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/audit-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/audit-service:latest

      - name: Build and push Reminder Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/reminder-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/reminder-service:latest

      - name: Build and push Recurring Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/recurring-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/recurring-service:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest
