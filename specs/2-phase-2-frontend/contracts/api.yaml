openapi: 3.0.0
info:
  title: Hackathon 2 API
  description: API for the Hackathon 2 project, as defined in the project constitution.
  version: 2.0.0

paths:
  /api/auth/signup:
    post:
      summary: Creates a new user.
      responses:
        '200':
          description: User created successfully.
  
  /api/auth/login:
    post:
      summary: Authenticates a user and returns a JWT.
      responses:
        '200':
          description: Successful login, JWT returned.

  /api/tasks:
    get:
      summary: Get all tasks for the authenticated user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of tasks.
        '401':
          description: Unauthorized.
    post:
      summary: Create a new task for the authenticated user.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Task created.
        '401':
          description: Unauthorized.

  /api/tasks/{task_id}:
    get:
      summary: Get a single task by ID.
      security:
        - bearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A single task.
        '401':
          description: Unauthorized.
        '404':
          description: Task not found.
    put:
      summary: Update a task's title or due date.
      security:
        - bearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task updated.
        '401':
          description: Unauthorized.
        '404':
          description: Task not found.
    patch:
      summary: Partially update a task (e.g., toggle completion status).
      security:
        - bearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task updated.
        '401':
          description: Unauthorized.
        '404':
          description: Task not found.
    delete:
      summary: Delete a task.
      security:
        - bearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Task deleted.
        '401':
          description: Unauthorized.
        '404':
          description: Task not found.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT